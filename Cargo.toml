[workspace]
resolver = "2"
members = [
    "crates/makit-cli",
    "crates/makit-core",
    "crates/makit-geometry",
    "crates/makit-tools",
    "crates/makit-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["winterweken"]
license = "MIT"
repository = "https://github.com/winterweken/makit"

[workspace.dependencies]
# Internal crates
makit-core = { path = "crates/makit-core" }
makit-geometry = { path = "crates/makit-geometry" }
makit-tools = { path = "crates/makit-tools" }
makit-tui = { path = "crates/makit-tui" }

# TUI (ratatui 0.29 depends on crossterm 0.28.1 — keep these in lockstep)
ratatui = "0.29"
gag = "1"
os_pipe = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Config
figment = { version = "0.10", features = ["yaml", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP
reqwest = { version = "0.12", features = ["json"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Terminal
crossterm = { version = "0.28", features = ["event-stream"] }
# Already in the tree through crossterm; used to restore the terminal on SIGTERM.
signal-hook = "0.3"

# Testing
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
